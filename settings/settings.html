<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>個別指示の管理 - Slackメッセージ作成ヘルパー</title>
  <link rel="stylesheet" href="../sidepanel/sidepanel.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <h1>個別指示の管理</h1>

  <section class="card">
    <p class="settings-intro">
      サイドパネルの「個別指示」プルダウンに表示する内容を管理します。登録内容はローカルのJSONファイルに保存されます。
    </p>

    <div class="custom-instruction-manager">
      <button id="open-file-btn" class="btn btn-outline" type="button">既存ファイルを開く</button>
      <button id="create-file-btn" class="btn btn-outline" type="button">新規ファイルを作成</button>
      <span id="file-status" class="file-status">未接続</span>

      <div class="add-row">
        <input type="text" id="new-instruction-input" class="textbox" placeholder="新しい個別指示を追加" />
        <button id="add-instruction-btn" class="btn btn-outline" type="button">追加</button>
      </div>

      <ul id="instruction-list" class="instruction-list"></ul>
    </div>
  </section>

  <script src="../shared/storage.js"></script>
  <script src="settings.js"></script>
</body>
</html>
