<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Slackメッセージ作成ヘルパー</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <h1>Slackメッセージ作成ヘルパー</h1>

  <section class="card">
    <h2>初動対応</h2>

    <div class="field">
      <span class="field-label">① メンション</span>
      <div class="radio-group" id="mention-type-group">
        <label><input type="radio" name="mention-type" value="@here" checked /> @here</label>
        <label><input type="radio" name="mention-type" value="@channel" /> @channel</label>
      </div>
    </div>

    <div class="field">
      <span class="field-label">② メッセージ内容</span>
      <textarea id="mention-text" class="textbox" rows="3" readonly></textarea>
    </div>

    <button id="copy-mention-btn" class="btn btn-blue">上記の内容をコピー</button>
  </section>

  <section class="card">
    <h2>一次対応結果</h2>

    <div class="field">
      <span class="field-label">④ 対象ドメインもしくはホスト名</span>
      <input type="text" id="target-host" class="textbox" />
    </div>

    <div class="field">
      <span class="field-label">⑤ 確認箇所</span>
      <div class="radio-group" id="check-item-group">
        <label><input type="radio" name="check-item" value="WEB表示" checked /> WEB表示</label>
        <label><input type="radio" name="check-item" value="リモートデスクトップ接続" /> リモートデスクトップ接続</label>
        <label><input type="radio" name="check-item" value="5分待機" /> 5分待機</label>
        <label><input type="radio" name="check-item" value="サービス稼働" /> サービス稼働</label>
      </div>
    </div>

    <div class="field">
      <span class="field-label">⑥ 動作結果</span>
      <div class="radio-group" id="result-type-group">
        <label><input type="radio" name="result-type" value="問題なし" checked /> 問題なし</label>
        <label><input type="radio" name="result-type" value="電話エスカ" /> 電話エスカ</label>
        <label><input type="radio" name="result-type" value="メールエスカ" /> メールエスカ</label>
        <label><input type="radio" name="result-type" value="個別指示" /> 個別指示</label>
      </div>
    </div>

    <div class="field">
      <span class="field-label">⑦ 個別指示メッセージ</span>
      <select id="custom-instruction-select" class="textbox" disabled>
        <option value="">(登録なし)</option>
      </select>

      <div class="custom-instruction-manager">
        <button id="choose-file-btn" class="btn btn-outline" type="button">ファイルを選択/変更</button>
        <span id="file-status" class="file-status">未接続</span>

        <div class="add-row">
          <input type="text" id="new-instruction-input" class="textbox" placeholder="新しい個別指示を追加" />
          <button id="add-instruction-btn" class="btn btn-outline" type="button">追加</button>
        </div>

        <ul id="instruction-list" class="instruction-list"></ul>
      </div>
    </div>

    <button id="generate-message-btn" class="btn btn-green">メッセージ作成</button>

    <div class="field">
      <span class="field-label">⑨ 生成メッセージ（編集可能）</span>
      <textarea id="result-message" class="textbox" rows="5"></textarea>
    </div>

    <button id="copy-result-btn" class="btn btn-blue">上記の内容をコピー</button>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
